name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
            context: ./backend
            push: true 
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:mradul
